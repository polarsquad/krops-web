[tools]
uv = "0.12.1"

[tasks.assemble]
description = "Copy the krops submodule docs into build/docs with rewritten links"
run = "uv run python tools/assemble_docs.py"

[tasks.test]
description = "Unit tests for the assembler"
run = "uv run pytest -q"

[tasks.build]
description = "Assemble and build the static site into build/site (strict)"
depends = ["assemble"]
run = "uv run mkdocs build --strict"

[tasks.serve]
description = "Assemble and serve the site with live reload"
depends = ["assemble"]
run = "uv run mkdocs serve"

[tasks.image]
description = "Build the container image locally"
run = "docker build -t krops-web:dev ."
