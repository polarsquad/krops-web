# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Assembler unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
      - name: Sync
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Strict site build
        run: uv run python tools/assemble_docs.py && uv run mkdocs build --strict

  image:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Build (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: krops-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test read-only container
        run: |
          set -eu
          docker run -d --rm --name smoke --read-only --tmpfs /tmp -p 8080:8080 krops-web:ci
          healthy=0
          for _ in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8080/healthz; then healthy=1; break; fi
            sleep 0.5
          done
          test "$healthy" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/architecture/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/does-not-exist)" = 404
          curl -s http://127.0.0.1:8080/ | grep -q '<title>krops docs</title>'
          docker stop smoke
