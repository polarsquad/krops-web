# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: publish

# Publishes ghcr.io/polarsquad/krops-web on every push to main as
# sha-<short> plus a moving latest. Signing and SBOM attestation mirror
# polarsquad/krops .github/workflows/toolbox-release.yml (cosign keyless via
# the workflow's GitHub OIDC identity, Syft SPDX SBOM).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, push, sign, attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Docker login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata (sha-<short>, latest)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/polarsquad/krops-web
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up QEMU (linux/arm64 cross-build)
        uses: docker/setup-qemu-action@v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push multi-arch
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Sign the image (keyless, workflow identity)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Verify with:
          #   cosign verify ghcr.io/polarsquad/krops-web:latest \
          #     --certificate-identity-regexp '^https://github.com/polarsquad/krops-web/.github/workflows/publish.yml@refs/heads/main$' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          IFS=$'\n' read -ra tag_list -d '' <<< "$TAGS" || true
          for tag in "${tag_list[@]}"; do
            ref="${tag}@${DIGEST}"
            echo "signing ${ref}"
            cosign sign --yes "${ref}"
          done

      - name: Attach per-platform SBOMs (Syft)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The build pushes a multi-arch index. Syft catalogs one platform
          # when given an index reference, so resolve the index to its
          # platform manifests and scan and attest each one separately:
          # every published architecture gets an SBOM on its own digest.
          repo=ghcr.io/polarsquad/krops-web
          docker buildx imagetools inspect --raw "${repo}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture) \(.digest)"' \
            | while read -r arch manifest_digest; do
                ref="${repo}@${manifest_digest}"
                syft "${ref}" -o spdx-json > "sbom-${arch}.json"
                cosign attest --yes --predicate "sbom-${arch}.json" --type spdxjson "${ref}"
                echo "SBOM for linux/${arch} attested to ${ref}"
              done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: krops-web-sbom-spdx
          path: sbom-*.json
          retention-days: 30
