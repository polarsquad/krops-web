[project]
name = "krops-web"
version = "0.0.0"
description = "Documentation website for polarsquad/krops"
requires-python = ">=3.13"
dependencies = [
  "mkdocs-material==9.7.7",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
